<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEDUSA Yayın Ekranı</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070907;
      color: #e8ffe8;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      gap: 12px;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 460px;
      aspect-ratio: 9 / 16;
      background: #0d120d;
      border: 2px solid #1f3d1f;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 28px rgba(57, 255, 20, 0.14);
    }

    video#screenVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #050705;
      display: block;
    }

    .top-banner {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(10, 14, 10, 0.82);
      border: 1px solid rgba(57, 255, 20, 0.45);
      border-radius: 10px;
      pointer-events: none;
      z-index: 5;
    }

    .brand {
      font-weight: 800;
      letter-spacing: 1px;
      color: #39ff14;
      font-size: 13px;
    }

    .live-pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(57, 255, 20, 0.16);
      color: #7dff66;
      border: 1px solid rgba(57, 255, 20, 0.4);
    }

    .alert-box {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 64px;
      padding: 12px 14px;
      background: rgba(12, 18, 12, 0.92);
      border-left: 4px solid #39ff14;
      border-radius: 10px;
      color: #ffffff;
      font-size: 14px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.25s ease;
      pointer-events: none;
      z-index: 6;
    }

    .alert-box.show {
      opacity: 1;
      transform: translateY(0);
    }

    .controls {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      flex: 1;
      min-width: 130px;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid #39ff14;
      background: #112211;
      color: #39ff14;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    button.secondary {
      border-color: #2c472c;
      background: #141914;
      color: #cfe8cf;
    }

    .status {
      width: 100%;
      max-width: 460px;
      font-size: 12px;
      color: #9ec29e;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="stage">
    <div class="top-banner">
      <span class="brand">MEDUSA • YAYIN</span>
      <span class="live-pill" id="liveStatus">HAZIR</span>
    </div>

    <video id="screenVideo" autoplay playsinline muted></video>

    <div class="alert-box" id="alertBox"></div>
  </div>

  <div class="controls">
    <button id="shareBtn">Ekranı Paylaş</button>
    <button id="stopBtn" class="secondary">Durdur</button>
    <button id="testAlertBtn" class="secondary">Test Bildirim</button>
  </div>

  <div class="status" id="statusText">Tarayıcıda "Ekranı Paylaş" butonuna basarak test et.</div>

  <script>
    const shareBtn = document.getElementById("shareBtn");
    const stopBtn = document.getElementById("stopBtn");
    const testAlertBtn = document.getElementById("testAlertBtn");
    const screenVideo = document.getElementById("screenVideo");
    const statusText = document.getElementById("statusText");
    const liveStatus = document.getElementById("liveStatus");
    const alertBox = document.getElementById("alertBox");

    let activeStream = null;
    let alertTimer = null;

    function showAlert(text) {
      alertBox.textContent = text;
      alertBox.classList.add("show");
      clearTimeout(alertTimer);
      alertTimer = setTimeout(() => {
        alertBox.classList.remove("show");
      }, 3000);
    }

    shareBtn.addEventListener("click", async () => {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
        statusText.textContent = "Bu tarayıcı getDisplayMedia desteklemiyor (Chrome'da HTTPS üzerinde dene).";
        return;
      }

      try {
        activeStream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: { ideal: 30, max: 60 } },
          audio: true
        });

        screenVideo.srcObject = activeStream;
        liveStatus.textContent = "YAYINDA";
        statusText.textContent = "Ekran paylaşımı aktif!";
        showAlert("Ekran paylaşımı başlatıldı!");

        const videoTrack = activeStream.getVideoTracks()[0];
        if (videoTrack) {
          videoTrack.onended = () => stopShare();
        }
      } catch (err) {
        statusText.textContent = "Paylaşım iptal edildi veya hata: " + err.message;
      }
    });

    function stopShare() {
      if (activeStream) {
        activeStream.getTracks().forEach(t => t.stop());
        activeStream = null;
      }
      screenVideo.srcObject = null;
      liveStatus.textContent = "HAZIR";
      statusText.textContent = "Ekran paylaşımı durduruldu.";
    }

    stopBtn.addEventListener("click", stopShare);

    testAlertBtn.addEventListener("click", () => {
      showAlert("🔥 Yeni Bildirim: Medusa yayında!");
    });
  </script>
</body>
  </html>
