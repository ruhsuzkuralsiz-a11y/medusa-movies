<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEDUSA Yayın Ekranı</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070907;
      color: #e8ffe8;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      gap: 10px;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 460px;
      aspect-ratio: 9 / 16;
      background: #0d120d;
      border: 2px solid #1f3d1f;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 28px rgba(57, 255, 20, 0.14);
    }

    video#screenVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #050705;
      display: block;
    }

    .top-banner {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(10, 14, 10, 0.82);
      border: 1px solid rgba(57, 255, 20, 0.45);
      border-radius: 10px;
      pointer-events: none;
      z-index: 5;
    }

    .brand {
      font-weight: 800;
      letter-spacing: 1px;
      color: #39ff14;
      font-size: 13px;
    }

    .live-pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(57, 255, 20, 0.16);
      color: #7dff66;
      border: 1px solid rgba(57, 255, 20, 0.4);
    }

    .alert-box {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 64px;
      padding: 12px 14px;
      background: rgba(12, 18, 12, 0.92);
      border-left: 4px solid #39ff14;
      border-radius: 10px;
      color: #ffffff;
      font-size: 14px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.25s ease;
      pointer-events: none;
      z-index: 6;
    }

    .alert-box.show {
      opacity: 1;
      transform: translateY(0);
    }

    .panel {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    input[type="text"] {
      flex: 1;
      min-width: 180px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #2c472c;
      background: #101610;
      color: #e8ffe8;
      font-size: 13px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #39ff14;
    }

    button, label.btn-file {
      flex: 1;
      min-width: 120px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #39ff14;
      background: #112211;
      color: #39ff14;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }

    button.secondary, label.btn-file.secondary {
      border-color: #2c472c;
      background: #141914;
      color: #cfe8cf;
    }

    input[type="file"] {
      display: none;
    }

    .status {
      width: 100%;
      max-width: 460px;
      font-size: 12px;
      color: #9ec29e;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="stage">
    <div class="top-banner">
      <span class="brand">MEDUSA • YAYIN</span>
      <span class="live-pill" id="liveStatus">HAZIR</span>
    </div>

    <video id="screenVideo" autoplay playsinline controls muted></video>

    <div class="alert-box" id="alertBox"></div>
  </div>

  <div class="panel">
    <div class="row">
      <input type="text" id="streamUrlInput" placeholder="Akış / MP4 / WebM linki yapıştır..." />
      <button id="loadUrlBtn">Yayına Al</button>
    </div>

    <div class="row">
      <label class="btn-file secondary" for="videoFileInput">Video Seç</label>
      <input type="file" id="videoFileInput" accept="video/*" />
      <button id="stopBtn" class="secondary">Durdur</button>
      <button id="testAlertBtn" class="secondary">Test Bildirim</button>
    </div>
  </div>

  <div class="status" id="statusText">Android tarayıcıda ekran çekme kapalı; harici akış linki veya video ile yayına alabilirsin.</div>

  <script>
    const loadUrlBtn = document.getElementById("loadUrlBtn");
    const streamUrlInput = document.getElementById("streamUrlInput");
    const videoFileInput = document.getElementById("videoFileInput");
    const stopBtn = document.getElementById("stopBtn");
    const testAlertBtn = document.getElementById("testAlertBtn");
    const screenVideo = document.getElementById("screenVideo");
    const statusText = document.getElementById("statusText");
    const liveStatus = document.getElementById("liveStatus");
    const alertBox = document.getElementById("alertBox");

    let alertTimer = null;
    let objectUrl = null;

    function showAlert(text) {
      if (!text) return;
      alertBox.textContent = text;
      alertBox.classList.add("show");
      clearTimeout(alertTimer);
      alertTimer = setTimeout(() => {
        alertBox.classList.remove("show");
      }, 3500);
    }

    function setLive(isLive, msg) {
      liveStatus.textContent = isLive ? "YAYINDA" : "HAZIR";
      statusText.textContent = msg;
    }

    loadUrlBtn.addEventListener("click", () => {
      const url = streamUrlInput.value.trim();
      if (!url) {
        statusText.textContent = "Önce bir video veya akış bağlantısı gir.";
        return;
      }
      if (objectUrl) {
        URL.revokeObjectURL(objectUrl);
        objectUrl = null;
      }
      screenVideo.srcObject = null;
      screenVideo.src = url;
      screenVideo.play().then(() => {
        setLive(true, "Bağlantı sahneye alındı.");
        showAlert("🎬 Yayın akışı başlatıldı!");
      }).catch((err) => {
        setLive(false, "Akış oynatılamadı: " + err.message);
      });
    });

    videoFileInput.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      if (objectUrl) {
        URL.revokeObjectURL(objectUrl);
      }
      objectUrl = URL.createObjectURL(file);
      screenVideo.srcObject = null;
      screenVideo.src = objectUrl;
      screenVideo.play().then(() => {
        setLive(true, "Yerel video sahneye alındı: " + file.name);
        showAlert("📹 Video yayına alındı!");
      }).catch((err) => {
        setLive(false, "Video açılamadı: " + err.message);
      });
    });

    stopBtn.addEventListener("click", () => {
      screenVideo.pause();
      screenVideo.removeAttribute("src");
      screenVideo.load();
      if (objectUrl) {
        URL.revokeObjectURL(objectUrl);
        objectUrl = null;
      }
      setLive(false, "Yayın durduruldu.");
    });

    testAlertBtn.addEventListener("click", () => {
      showAlert("🔥 Yeni Bildirim: Medusa yayında!");
    });

    const params = new URLSearchParams(window.location.search);
    const initialStream = params.get("stream");
    const initialAlert = params.get("alert");
    if (initialStream) {
      streamUrlInput.value = initialStream;
      loadUrlBtn.click();
    }
    if (initialAlert) {
      showAlert(initialAlert);
    }
  </script>
</body>
</html>
