<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film İzle - Medusa Movies</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        .header-back {
            color: #e50914;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 15px;
            display: inline-block;
        }
        .server-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .server-btn {
            background-color: #1f1f1f;
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            transition: 0.3s;
        }
        .server-btn.active {
            background-color: #e50914;
            color: #fff;
        }
        .player-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .warning-text {
            color: #888;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }
        .movie-info {
            margin-top: 20px;
        }
        .movie-title {
            color: #e50914;
            font-size: 24px;
            font-weight: bold;
        }
        .movie-meta {
            color: #f1c40f;
            font-size: 15px;
            margin-top: 5px;
        }
        .movie-overview {
            color: #ccc;
            font-size: 14px;
            line-height: 1.6;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="/" class="header-back">← Anasayfaya Dön</a>

        <div class="server-tabs">
            <button class="server-btn active" onclick="changeServer('server1', this)">🎬 Server 1 (Dublaj)</button>
            <button class="server-btn" onclick="changeServer('server2', this)">⚡ Server 2 (Altyazı)</button>
            <button class="server-btn" onclick="changeServer('multiembed', this)">🔥 Multiembed</button>
            <button class="server-btn" onclick="changeServer('fragman', this)">🍿 Fragman</button>
        </div>

        <div class="player-container">
            <iframe id="moviePlayer" src="" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>
        </div>

        <div class="warning-text">
            * Server 1 açılmazsa yukarıdan Server 2 veya Multiembed seçeneğine geçebilirsin kanka.
        </div>

        <div class="movie-info">
            <div class="movie-title">Odyssey</div>
            <div class="movie-meta">
                <span>📅 2026</span> &nbsp;&nbsp;|&nbsp;&nbsp; <span>⭐️ 8.4 / 10</span>
            </div>
            <div class="movie-overview">
                <strong>Film ID:</strong> {{ movie_id }}<br><br>
                <strong>Özet:</strong> Muazzam arayüzü ve çoklu sunucu altyapısıyla Medusa Movies yayına hazır!
            </div>
        </div>
    </div>

    <script>
        const movieId = "{{ movie_id }}";
        
        const servers = {
            "server1": "https://multiembed.mov/?video_id=" + movieId,
            "server2": "https://vidsrc.xyz/embed/movie?imdb=" + movieId,
            "multiembed": "https://multiembed.mov/?video_id=" + movieId + "&player=2",
            "fragman": "https://www.youtube.com/embed/dQw4w9WgXcQ"
        };

        document.getElementById('moviePlayer').src = servers["server1"];

        function changeServer(serverName, buttonElement) {
            document.querySelectorAll('.server-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
            document.getElementById('moviePlayer').src = servers[serverName];
        }
    </script>
</body>
</html>
